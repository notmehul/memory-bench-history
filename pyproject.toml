[project]
name = "membench"
version = "0.1.0"
description = "memory-bench: benchmark for tiered, typed, longitudinal memory dynamics in simulated organizations"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mehul", email = "hello@biome.in" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = ["datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
