[project]
name = "membench"
version = "0.1.0"
description = "memory-bench: benchmark for tiered, typed, longitudinal memory dynamics in simulated organizations"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mehul", email = "hello@biome.in" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
adapters = ["google-genai>=1.0"]
# market systems (v1 freeze); installed separately so the core stays dependency-free
market = ["mem0ai>=2.0,<3", "cognee>=1.4", "graphiti-core[kuzu,google-genai]>=0.29", "supermemory>=3.59"]
figures = ["matplotlib>=3.8"]
# G4 rater sheet round trip (scripts/calibration_sheet.py)
sheet = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = ["datasets", ".*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
